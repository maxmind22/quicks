<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quicks - AI Document Search</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome for Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css')}}"
    />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent border-bottom border-secondary border-opacity-10 py-3">
      <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="/">
          <i class="fa-solid fa-bolt text-warning me-2"></i>
          <span class="logo-text">Quicks</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link px-3" href="{{ url_for('home') }}">Home</a>
            </li>
            
            {% if not current_user.is_authenticated: %}
            <li class="nav-item">
              <a class="nav-link px-3" href="{{ url_for('login') }}">Login</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-light btn-sm px-3 ms-2" href="{{ url_for('register') }}">Register</a>
            </li>
           
            {% else: %}
            <li class="nav-item">
              <a class="nav-link px-3" href="{{ url_for('dashboard') }}">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link px-3" href="{{ url_for('upload') }}">Upload</a>
            </li>
            <li class="nav-item ms-lg-3">
              <div class="d-flex align-items-center">
                <span class="navbar-text me-3 text-light opacity-75">
                  <i class="fa-regular fa-user me-1 text-info"></i> {{ current_user.name }}
                </span>
                <a class="btn btn-danger btn-sm px-3" href="{{ url_for('logout') }}">Log Out</a>
              </div>
            </li>
            {% endif %}
          </ul>
        </div>
      </div>
    </nav>

    <div class="main-container">
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
